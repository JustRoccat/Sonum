[package]
name = "sonum"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "compression-full", "catch-panic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.21"
walkdir = "2"
sha2 = "0.10"
percent-encoding = "2"
anyhow = "1"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "6"
httpdate = "1"

[profile.release]
opt-level = 3
lto = true
